<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CARDAPP - Cardápio Digital</title>
    <meta name="description" content="Cardápio digital moderno e interativo em amarelo e branco para clientes e painel administrativo completo para o CEO." />
    <link rel="canonical" href="https://cardapp-us.vercel.app/" />
    
    <!-- Theme & Favicon -->
    <meta name="theme-color" content="#F59E0B" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Open Graph / WhatsApp / Facebook Share -->
    <meta property="og:title" content="CARDAPP - Cardápio Digital" />
    <meta property="og:description" content="Cardápio digital moderno e interativo em amarelo e branco para clientes e painel administrativo completo para o CEO." />
    <meta property="og:url" content="https://cardapp-us.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CARDAPP" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CARDAPP - Cardápio Digital" />
    <meta name="twitter:description" content="Cardápio digital moderno e interativo em amarelo e branco para clientes e painel administrativo completo para o CEO." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Montserrat:wght@500;600;700;800&family=Outfit:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div id="initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #FFFDF7; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif; color: #0F172A; padding: 24px; text-align: center;">
        <div style="width: 76px; height: 76px; border-radius: 26px; background: #F59E0B; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 28px -6px rgba(245, 158, 11, 0.45); margin-bottom: 20px;">
          <svg style="width: 38px; height: 38px; color: #0F172A;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 2v6a3 3 0 0 1-3 3 3 3 0 0 1-3-3V2"></path>
            <path d="M15 2v10"></path>
            <path d="M15 17v5"></path>
            <path d="M6 2v20"></path>
            <path d="M6 2a4 4 0 0 1 4 4v2a4 4 0 0 1-4 4"></path>
          </svg>
        </div>
        <h1 style="font-size: 24px; font-weight: 900; margin: 0 0 6px; letter-spacing: -0.5px;">CARDAPP</h1>
        <p style="font-size: 13px; color: #64748B; margin: 0 0 20px; font-weight: 600;">Carregando cardápio e painel em tempo real...</p>
        <div style="width: 160px; height: 4px; background: #E2E8F0; border-radius: 9999px; overflow: hidden; position: relative;">
          <div style="position: absolute; top: 0; left: 0; bottom: 0; width: 45%; background: #F59E0B; border-radius: 9999px; animation: cardapp-loader-anim 1.2s ease-in-out infinite;"></div>
        </div>
        <style>
          @keyframes cardapp-loader-anim {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(260%); }
          }
        </style>
        <div id="loader-fallback-prompt" style="display: none; margin-top: 28px; max-width: 320px; flex-direction: column; gap: 8px;">
          <p style="font-size: 11px; color: #94A3B8; margin: 0 0 6px;">Demorando mais do que o esperado?</p>
          <button onclick="window.location.reload()" style="background: #F59E0B; color: #0F172A; border: none; padding: 11px 18px; border-radius: 12px; font-weight: 800; font-size: 12px; cursor: pointer; box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);">Recarregar Página</button>
          <button onclick="try{sessionStorage.clear();localStorage.removeItem('cardapp_last_view');localStorage.removeItem('cardapp_ceo_open');localStorage.removeItem('cardapp_superadmin_open');}catch(e){}window.location.href='/?view=cliente'" style="background: #F1F5F9; color: #334155; border: 1px solid #CBD5E1; padding: 11px 18px; border-radius: 12px; font-weight: 700; font-size: 12px; cursor: pointer;">Abrir Cardápio Direto</button>
        </div>
        <script>
          setTimeout(function() {
            var fb = document.getElementById('loader-fallback-prompt');
            if (fb) fb.style.display = 'flex';
          }, 3500);
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
